# Builds the backend image and rolls the ECS service onto it. Same shape as
# w_notes' deploy: the image is tagged with the commit SHA and gets its own task
# definition revision, so the circuit breaker has a real previous revision to
# roll back to.
#
#   push to main (backend/** changed) - a merge ships itself
#   workflow_dispatch                 - redeploy by hand, e.g. after `terraform apply`
name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '!backend/tests/**'
      - '!backend/database/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# One deploy at a time, and never cancel one in flight.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: portfolio-api
  ECS_CLUSTER: wnotes-cluster
  ECS_SERVICE: portfolio-api
  TASK_FAMILY: portfolio-api
  CONTAINER_NAME: api
  HEALTH_URL: https://api.rileydrcelik.com/health

jobs:
  deploy:
    name: Build + deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}"
          docker build -t "$IMAGE" -t "$REGISTRY/$ECR_REPOSITORY:latest" ./backend
          docker push "$IMAGE"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # From the family's latest revision rather than the service's, so a
      # `terraform apply` (new env vars, sizes) reaches production on the next
      # deploy.
      - name: Register task definition revision
        id: taskdef
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          set -euo pipefail
          aws ecs describe-task-definition \
            --task-definition "$TASK_FAMILY" \
            --query taskDefinition > current.json

          jq --arg IMAGE "$IMAGE" --arg NAME "$CONTAINER_NAME" '
            .containerDefinitions |= map(if .name == $NAME then .image = $IMAGE else . end)
            | del(
                .taskDefinitionArn, .revision, .status, .requiresAttributes,
                .compatibilities, .registeredAt, .registeredBy, .deregisteredAt
              )
          ' current.json > new.json

          if ! jq -e --arg IMAGE "$IMAGE" \
              'any(.containerDefinitions[]; .image == $IMAGE)' new.json > /dev/null; then
            echo "::error::No container named '$CONTAINER_NAME' in family '$TASK_FAMILY'."
            exit 1
          fi

          ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new.json \
            --query taskDefinition.taskDefinitionArn --output text)
          echo "Registered $ARN"
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      - name: Roll the service
        env:
          TASKDEF_ARN: ${{ steps.taskdef.outputs.arn }}
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$TASKDEF_ARN" > /dev/null
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

      # services-stable also succeeds when the circuit breaker settled the
      # service by rolling back.
      - name: Confirm the new revision is live
        env:
          TASKDEF_ARN: ${{ steps.taskdef.outputs.arn }}
        run: |
          set -euo pipefail
          RUNNING=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' --output text)
          if [ "$RUNNING" != "$TASKDEF_ARN" ]; then
            echo "::error::Deploy did not stick. Expected $TASKDEF_ARN, service is running $RUNNING."
            exit 1
          fi

      - name: Verify public health endpoint
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$HEALTH_URL" || echo 000)
            if [ "$code" = "200" ]; then
              echo "$HEALTH_URL -> 200"
              exit 0
            fi
            echo "attempt $attempt: $HEALTH_URL -> $code"
            sleep 10
          done
          echo "::error::$HEALTH_URL never returned 200 after the deploy."
          exit 1
